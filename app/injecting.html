<!doctype html>
<html lang="">

  <head>
    <meta charset="utf-8">
    <title>The Ego, and It's 0wned - Shot (Estrogen)</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta property="og:title" content="">
    <meta property="og:type" content="">
    <meta property="og:url" content="">
    <meta property="og:image" content="">

    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.png">

    <link href="./css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx">

    <meta name="theme-color" content="#fafafa">
  </head>

  <body>

    <div class="container position-relative vw-100 vh-100">
      <div class="position-absolute top-50 start-50 translate-middle">
        <div style="width: 100vmin; height: 100vmin; transform: scaleY(-1.0);" id="main"></div>
      </div>
    </div>

    <script src="./js/modernizr-3.12.0.min.js"></script>
    <script src="./js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"></script>
    <script src="./js/rxjs.js"></script>
    <script type="module">
      const { interval, map } = rxjs;
      import { epoch } from "./js/eeg-pipes.js";
      import * as echarts from "./js/echarts.esm.min.js"

      const response = await fetch("./data/injection.json")
      const data = await response.json();

      const chart = echarts.init(document.getElementById('main'));

      chart.setOption({
        // No padding
        grid: {
          left: 0,
          top: 0,
          right: 0,
          bottom: 0
        },
        animation: false,
        xAxis: {
          show: false,
          data: ['', '', '', '', '', '', ''],
        },
        yAxis: {
          show: false,
        },
        color: ['magenta'],
        series: [
          {
            name: 'ouch',
            type: 'pictorialBar',
            barCategoryGap: '-200%',
            //symbol: 'path://M0,10 L10,10 L5,0 L0,10 z',
            symbol: 'path://M0,10 L10,10 C5.5,10 5.5,5 5,0 C4.5,5 4.5,10 0,10 z',
            itemStyle: {
              opacity: 1.0
            },
            data: [1,2,3,4,5,6,7],
            z: 10
          }
        ]
      });

      const eeg = interval(1000 / 250)
            .pipe(
              map(interval => data[interval % data.length])
            );

      eeg.pipe(
          epoch({ duration: 1, interval: 1000 / 250 })
      ).subscribe(e => {
          chart.setOption({
             series: [
              {
                data: [
                  {
                    value: e.data[0][0]
                  },
                  {
                    value: e.data[1][0]
                  },
                  {
                    value: e.data[2][0]
                  },
                  {
                    value: e.data[3][0]
                  },
                  // nan :-/
                  /*{
                    value: e.data[4][0]
                  },*/
                  {
                    value: e.data[5][0]
                  },
                  {
                    value: e.data[6][0]
                  },
                  {
                    value: e.data[7][0]
                  },
                ],
              },
            ]
          });
      });

    </script>

  </body>

</html>
