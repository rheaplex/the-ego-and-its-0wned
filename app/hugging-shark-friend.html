<!doctype html>
<html lang="">

<head>
  <meta charset="utf-8">
  <title>The Ego, and It's 0wned - Hugging Shark Friend</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.png">

  <link href="./css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx">

  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <div class="container position-relative vw-100 vh-100">
      <div class="position-absolute top-50 start-50 translate-middle">
        <canvas style="width: 100vmin; height: 100vmin;" class="d-inline-block" id="main"></div>
      </div>
    </div>

  <script src="./js/modernizr-3.12.0.min.js"></script>
  <script src="./js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"></script>
  <script src="./js/rxjs.js"></script>
  <script type="module">
    const { interval, map } = rxjs;
    import { epoch } from "./js/eeg-pipes.js";
    import { WebglPlot, WebglLine, ColorRGBA } from "./js/webglplot.esm.js";

    const response = await fetch("./data/hugging-shark-friend.json");
    const data = await response.json();

    const canvas = document.getElementById("main");
    const devicePixelRatio = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
    
    const numX = 2048;
    const numChannels = 8;
    const wglp = new WebglPlot(canvas);

    const lines = [];
    for (let i = 0; i < numChannels; i++) {
      const color = new ColorRGBA(0.0, Math.random(), Math.random(), 1);
      const line = new WebglLine(color, numX);
      line.arrangeX();
      line.scaleY = 2.0;
      line.offsetY = - 1.0
      lines[i] = line;
      wglp.addLine(line);
    }
    
    // Only update the WebglPlot when we have set new data on the line
    let shouldUpdate = false;

    const eeg = interval(1000 / 250)
          .pipe(
            map(interval => data[interval % data.length])
          );
    
    eeg.pipe(
      epoch({ duration: numX, interval: 1000 / 250 }),
    ).subscribe(e => {
      for (let l = 0; l < numChannels; l++) {
        for (let i = 0; i < e.data[0].length; i++) {
          lines[l].setY(i, e.data[l][i]);
        }
      }
      shouldUpdate = true;
    });

    const newFrame = () => {
      if (shouldUpdate) {
        wglp.update();
        shouldUpdate = false;
      }
      requestAnimationFrame(newFrame);
    }
    requestAnimationFrame(newFrame);

  </script>

</body>

</html>
