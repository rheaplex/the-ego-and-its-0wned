        yAxis: [
          {
            type: 'value',
            axisTick: {},
            axisLabel: {},
            show: false,
          }
        ],
        series: [
          {
            name: 'Line 1',
            type: 'line',
            stack: 'Total',
            smooth: true,
            lineStyle: {
              width: 0
            },
            showSymbol: false,
            areaStyle: {

      const eeg = interval(1000 / 250)
            .pipe(
              map(interval => data[interval % data.length])
            );

      eeg.pipe(
        epoch({ duration: 555, interval: 1000 / 250 }),
      ).subscribe(e => {
        chart.setOption({
          animation: true,
          series: [
            { data: e.data[0] },
            { data: e.data[1] },
            { data: e.data[2] },
            { data: e.data[3] },
            { data: e.data[4] },
            { data: e.data[5] },
            { data: e.data[6] },
            { data: e.data[7] },

        });
