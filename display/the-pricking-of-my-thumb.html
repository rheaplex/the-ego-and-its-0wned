<!doctype html>
<html lang="">

<head>
  <meta charset="utf-8">
  <title>The Ego and it's 0wned - The Pricking of My Thumb</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link href="./css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx">

  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <div class="container fixed-bottom">
    <div class="row">
      <div class="col">
        <h1 class="display-6">The Pricking of My Thumb</h1>
      </div>
      <div class="col">
        <p class="fw-light" style="color: #f00;">Gamma</p>
      </div>
      <div class="col justify-content-end">
        <h1 class="display-6 text-primary text-opacity-25"
            style="width: 13en;"
            id="timestamp"></h1>
      </div>
    </div>
  </div>

  <div class="container position-relative vw-100 vh-100">
    <div class="position-absolute top-50 start-50 translate-middle">
      <canvas style="width: 75vmin; height: 75vmin;" id="my_canvas"></canvas>
    </div>
  </div>

  <script src="./js/modernizr-3.12.0.min.js"></script>
  <script src="./js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"></script>
  
  <script type="module">
    import { createEEG, epoch } from "./js/eeg-pipes.js";
    import { WebglPlot, WebglPolar, ColorRGBA } from "./js/webglplot.esm.js";
    
    const canvas = document.getElementById("my_canvas");
    const devicePixelRatio = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;

    const numPoints = 360;
    const scale = 0.02;
    const color = new ColorRGBA(1, 0, 0, 1);
    const line = new WebglPolar(color, numPoints);
    const wglp = new WebglPlot(canvas);

    wglp.addLine(line);

    // Only update the WebglPlot when we have set new data on the line
    let shouldUpdate = false;

    const eeg = createEEG();
    eeg.pipe(
      epoch({ duration: numPoints, interval: 1 }),
    ).subscribe(e => {
        const numSamples = e.data[0].length;
        const thetaDelta = 360.0 / numSamples;
        for (let i = 0; i < numSamples; i++) {
            // FIXME: scale and center on radius.
            line.setRtheta(i, i * thetaDelta, 0.2 + Math.abs(e.data[0][i] * scale));
        }
        document.getElementById("timestamp").innerHTML = e.info.startTime;
        shouldUpdate = true;
    });

    const newFrame = () => {
      if (shouldUpdate) {
        wglp.update();
        shouldUpdate = false;
      }
      requestAnimationFrame(newFrame);
    }
    requestAnimationFrame(newFrame);

  </script>

</body>

</html>
