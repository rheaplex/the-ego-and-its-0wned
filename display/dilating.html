<!doctype html>
<html lang="">

  <head>
    <meta charset="utf-8">
    <title>The Ego, and It's 0wned - Dilating</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta property="og:title" content="">
    <meta property="og:type" content="">
    <meta property="og:url" content="">
    <meta property="og:image" content="">

    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.png">

    <link href="./css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx">

    <meta name="theme-color" content="#fafafa">
  </head>

  <body>

    <div class="container fixed-bottom">
      <div class="row">
        <div class="col">
          <h1 class="display-6">Dilating</h1>
        </div>
        <div class="col">
          <p class="fw-light" style="color: #f00;">Epsilon</p>
        </div>
        <div class="col justify-content-end">
          <h1 class="display-6 text-primary text-opacity-25"
              style="width: 13en;"
              id="timestamp"></h1>
        </div>
      </div>
    </div>

    <div class="container position-relative vw-100 vh-100">
      <div class="position-absolute top-50 start-50 translate-middle">
        <div style="width: 75vmin; height: 75vmin;" id="main"></div>
      </div>
    </div>

    <script src="./js/modernizr-3.12.0.min.js"></script>
    <script src="./js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"></script>
    
    <script type="module">
      import { createEEG, epoch } from "./js/eeg-pipes.js";
      import * as echarts from "./js/echarts.esm.min.js"

      // Only update the WebglPlot when we have set new data on the line
      let shouldUpdate = false;

      const chart = echarts.init(document.getElementById('main'));
      chart.setOption({
          series: [
              {
                  type: 'pie',
                  roseType: 'area',
                  animation: false,
                  radius: ['25%', '100%'],
                  center: ['50%', '50%'],
                  label: {
                      show: false
                  },
                  data: [
                      {
                          value: 100
                      },
                      {
                          value: 200,
                          name: 'B'
                      },
                      {
                          value: 300,
                          name: 'C'
                      },
                      {
                          value: 400,
                          name: 'D'
                      },
                  ],
              },
          ],
          color: [
              '#c23531',
              '#2f4554',
              '#61a0a8',
              '#d48265',
          ],
      });

      const scale = 200;

      const eeg = createEEG();
      eeg.pipe(
          epoch({ duration: 1, interval: 10 }),
      ).subscribe(e => {
          chart.setOption({
              animation: true,
              series: [
                  {
                      data: [
                          {
                              value: Math.abs(e.data[0][0]) * scale
                          },
                          {
                              value: Math.abs(e.data[1][0]) * scale
                          },
                          {
                              value: Math.abs(e.data[2][0]) * scale
                          },
                          {
                              value: Math.abs(e.data[3][0]) * scale
                          },
                      ],
                  },
              ]
          });
          document.getElementById("timestamp").innerHTML = e.info.startTime;
          shouldUpdate = true;
      });

      /*const newFrame = () => {
          if (shouldUpdate) {
              shouldUpdate = false;
          }
          requestAnimationFrame(newFrame);
      }
      requestAnimationFrame(newFrame);*/

    </script>

  </body>

</html>
